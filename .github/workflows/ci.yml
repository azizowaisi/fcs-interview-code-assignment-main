name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: |
          cd java-assignment
          ./mvnw -B verify

      - name: Upload JaCoCo report (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: java-assignment/target/site/jacoco/
          retention-days: 7
